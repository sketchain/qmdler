[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qmdler"
version = "0.1.0"
description = "QQ 音乐歌单批量下载器，提供 WebUI 与 TUI 两套前端"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "qmdler contributors" }]
keywords = ["qqmusic", "downloader", "textual", "fastapi"]
classifiers = [
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio",
]

dependencies = [
    "qqmusic-api-python==0.7.2",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.27.0",
    "websockets>=13.0",
    "aiosqlite>=0.20.0",
    "mutagen>=1.47.0",
    "pydantic>=2.13.3",
    "pydantic-settings>=2.6.0",
    "tomlkit>=0.13.0",
    "typer>=0.15.0",
    "rich>=13.9.0",
    "textual>=1.0.0",
    # QR.data 是图片而非文本载荷, 终端二维码靠还原模块矩阵渲染, 需要读图.
    "pillow>=10.0.0",
    "tomli>=2.0.1; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "respx>=0.21.1",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    # 只用于诊断模式解出二维码载荷、以及验证字符画真能被扫出来。
    # 运行时代码不得依赖它（core/auth/qrpayload.py 全程惰性导入）。
    "zxing-cpp>=2.2.0",
]

[project.scripts]
qmdler = "qmdler.cli:main"

[project.urls]
Homepage = "https://github.com/sketchain/qmdler"
Source = "https://github.com/sketchain/qmdler"

[tool.hatch.build.targets.wheel]
packages = ["src/qmdler"]

[tool.hatch.build.targets.sdist]
include = ["src/qmdler", "tests", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.10"
packages = ["qmdler"]
mypy_path = "src"
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
check_untyped_defs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
